<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MPU6050 Wasserwaage</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: #1a1a2e; color: #eee;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh; padding: 20px;
  }
  h1 { font-size: 1.3em; margin-bottom: 20px; color: #8be; }
  svg { filter: drop-shadow(0 2px 10px rgba(0,0,0,0.6)); }
  .btn {
    margin-top: 14px; padding: 10px 24px; border: 1px solid #445;
    background: #2a2a4e; color: #8be; border-radius: 6px;
    font-size: 0.95em; cursor: pointer;
  }
  .btn:active { background: #3a3a5e; }
  .btn.connect { background: #2a5a3e; border-color: #4a5; }
  .btn.connect:active { background: #3a6a4e; }
  #status {
    margin-top: 10px; font-size: 0.75em; color: #c44;
  }
  .overlay {
    display:none; position:fixed; top:0;left:0;right:0;bottom:0;
    background:rgba(0,0,0,0.7); justify-content:center; align-items:center;
    z-index:10;
  }
  .overlay.show { display:flex; }
  .panel {
    background:#1e2a3a; border:1px solid #445; border-radius:12px;
    padding:24px; width:280px;
  }
  .panel h2 { font-size:1.1em; color:#8be; margin-bottom:16px; }
  .panel label { display:block; color:#aaa; font-size:0.8em; margin-bottom:4px; }
  .panel input {
    width:100%; padding:8px; margin-bottom:14px; border:1px solid #445;
    background:#0e1520; color:#eee; border-radius:6px; font-size:1em;
    text-align:center;
  }
  .panel .btns { display:flex; gap:10px; margin-top:4px; }
  .panel button {
    flex:1; padding:8px; border:none; border-radius:6px;
    font-size:0.9em; cursor:pointer;
  }
  .panel .ok { background:#4a5; color:#fff; }
  .panel .cancel { background:#445; color:#aaa; }
  .buttons { display:flex; gap:10px; }
</style>
</head>
<body>
<h1>MPU6050 Wasserwaage</h1>

<svg width="380" height="320" viewBox="-150 -155 380 320" overflow="visible">
  <defs>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2a3a"/>
      <stop offset="100%" stop-color="#0e1520"/>
    </radialGradient>
    <radialGradient id="bubbleGrad" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#a0f0c0"/>
      <stop offset="100%" stop-color="#2a8c5a"/>
    </radialGradient>
  </defs>
  <circle r="130" fill="url(#bg)"/>
  <circle r="30" fill="none" stroke="#2a3a4a" stroke-width="1"/>
  <circle r="65" fill="none" stroke="#2a3a4a" stroke-width="1"/>
  <circle r="100" fill="none" stroke="#2a3a4a" stroke-width="1"/>
  <line x1="-130" y1="0" x2="130" y2="0" stroke="#2a3a4a" stroke-width="1"/>
  <line x1="0" y1="-130" x2="0" y2="130" stroke="#2a3a4a" stroke-width="1"/>
  <circle id="centerMark" r="22" fill="none" stroke="#c44" stroke-width="2"/>
  <circle r="130" fill="none" stroke="#445" stroke-width="3"/>
  <text id="rollTxt" x="140" y="5" text-anchor="start" fill="#8be" font-size="13" font-weight="bold">0.0°</text>
  <text id="pitchTxt" x="0" y="-138" text-anchor="middle" fill="#8be" font-size="13" font-weight="bold">0.0°</text>
  <circle id="bubble" r="20" cx="0" cy="0" fill="url(#bubbleGrad)" opacity="0.85"
          filter="url(#glow)" style="transition:cx 0.15s ease-out,cy 0.15s ease-out"/>
</svg>

<div class="buttons">
  <button class="btn connect" id="connectBtn" onclick="bleConnect()">Verbinden</button>
  <button class="btn" onclick="openSetup()">Setup</button>
</div>
<div id="status">Getrennt</div>

<div class="overlay" id="overlay">
  <div class="panel">
    <h2>Einstellungen</h2>
    <label>Max. Auslenkung (&deg;)</label>
    <input id="inMax" type="number" step="1" min="1" max="90" value="10">
    <label>Toleranz f&uuml;r Gr&uuml;n (&deg;)</label>
    <input id="inTol" type="number" step="0.1" min="0.1" max="10" value="0.1">
    <label>Wake-Intervall (s)</label>
    <input id="inWake" type="number" step="1" min="5" max="300" value="15">
    <div class="btns">
      <button class="cancel" onclick="closeSetup()">Abbrechen</button>
      <button class="ok" onclick="saveSetup()">OK</button>
    </div>
  </div>
</div>

<script>
  var MA=10, TOL=0.1, MP=105, WAKE=15;
  var bleDevice=null, sensorChar=null, configChar=null;
  var SVC='12345678-1234-1234-1234-123456789abc';
  var SENSOR='12345678-1234-1234-1234-123456789abd';
  var CONFIG='12345678-1234-1234-1234-123456789abe';

  function cl(v){return Math.max(-MA,Math.min(MA,v));}
  function setStatus(txt,color){
    document.getElementById('status').textContent=txt;
    document.getElementById('status').style.color=color||'#667';
  }

  async function bleConnect(){
    try {
      setStatus('Suche...','#aa8');
      bleDevice = await navigator.bluetooth.requestDevice({
        filters:[{name:'MPU6050-Level'}],
        optionalServices:[SVC]
      });
      bleDevice.addEventListener('gattserverdisconnected', onDisconnect);

      setStatus('Verbinde...','#aa8');
      var server = await bleDevice.gatt.connect();
      var service = await server.getPrimaryService(SVC);

      sensorChar = await service.getCharacteristic(SENSOR);
      configChar = await service.getCharacteristic(CONFIG);

      // Wake-Intervall vom ESP32 lesen
      var val = await configChar.readValue();
      var w = parseInt(new TextDecoder().decode(val));
      if(w>=5 && w<=300) WAKE=w;

      // Notifications starten
      await sensorChar.startNotifications();
      sensorChar.addEventListener('characteristicvaluechanged', onSensorData);

      setStatus('Verbunden','#4a5');
      document.getElementById('connectBtn').textContent='Verbunden';
    } catch(e) {
      setStatus('Fehler: '+e.message,'#c44');
      document.getElementById('connectBtn').textContent='Verbinden';
    }
  }

  function onDisconnect(){
    setStatus('Getrennt','#c44');
    document.getElementById('connectBtn').textContent='Verbinden';
    sensorChar=null; configChar=null;
  }

  function onSensorData(event){
    var raw = new TextDecoder().decode(event.target.value);
    var parts = raw.split(',');
    if(parts.length<2) return;
    var pitch = parseFloat(parts[0]);
    var roll = parseFloat(parts[1]);

    var bx=(cl(roll)/MA)*MP, by=(cl(pitch)/MA)*MP;
    document.getElementById('bubble').setAttribute('cx',bx);
    document.getElementById('bubble').setAttribute('cy',by);
    document.getElementById('rollTxt').textContent=roll.toFixed(1)+'\u00B0';
    document.getElementById('pitchTxt').textContent=pitch.toFixed(1)+'\u00B0';

    var cm=document.getElementById('centerMark');
    var level=(Math.abs(roll)<TOL && Math.abs(pitch)<TOL);
    cm.setAttribute('stroke',level?'#4c4':'#c44');
    cm.setAttribute('stroke-width',level?'3':'2');
  }

  function openSetup(){
    document.getElementById('inMax').value=MA;
    document.getElementById('inTol').value=TOL;
    document.getElementById('inWake').value=WAKE;
    document.getElementById('overlay').classList.add('show');
  }
  function closeSetup(){document.getElementById('overlay').classList.remove('show');}

  async function saveSetup(){
    var m=parseFloat(document.getElementById('inMax').value);
    var t=parseFloat(document.getElementById('inTol').value);
    var w=parseInt(document.getElementById('inWake').value);
    if(m>0) MA=m;
    if(t>0) TOL=t;
    if(w>=5 && w<=300){
      WAKE=w;
      if(configChar){
        try {
          var enc=new TextEncoder();
          await configChar.writeValue(enc.encode(String(w)));
        } catch(e){ console.log('Config write error:',e); }
      }
    }
    closeSetup();
  }
</script>
</body>
</html>
